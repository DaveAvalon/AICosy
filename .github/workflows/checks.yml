name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run small headless standard-library checks
        run: python -m unittest tests.test_continuous_engine tests.test_continuous_service tests.test_experience_service tests.test_service tests.test_observer tests.test_recording_compatibility tests.test_protocols tests.test_http tests.test_release_config -v
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/aicosy-wheel" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/aicosy-installed" "$RUNNER_TEMP"/aicosy-wheel/*.whl
      - name: Check installed package resources outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/aicosy-installed
        run: |
          python - <<'PY'
          from importlib.metadata import files as distribution_files, metadata
          from importlib.resources import files
          from pathlib import Path
          import aicosy
          from adapters.http import WEB_ROOT
          assert aicosy.__version__ == "0.4.0"
          package = metadata("aicosy")
          assert package["Name"] == "aicosy"
          assert package["Author"] == "aicosy team"
          installed = [str(path) for path in distribution_files("aicosy")]
          assert not any(path.startswith("porn/") or path == "porn.py" for path in installed)
          expected = ("observer.html", "observer.css", "observer.js", "status.html")
          for name in expected:
              resource = files("aicosy").joinpath("web", name)
              assert resource.is_file(), name
              assert resource.read_bytes(), name
              assert (Path(WEB_ROOT) / name).is_file(), name
          print("Installed package version and four observer assets are present.")
          PY
          python -m adapters.http --help
          python -m adapters.cli --help
          python -m adapters.mcp --help
